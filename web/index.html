<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>atour · AJP 中国站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <p class="brand-mark">atour</p>
      <p class="brand-sub">AJP 中国站 · Men's / Women's · White+</p>
    </div>
    <p id="stats" class="stats" aria-live="polite"></p>
  </header>

  <section class="filters" aria-label="查询条件">
    <label class="field grow">
      <span>关键词</span>
      <input id="q" type="search" placeholder="选手 / 俱乐部" autocomplete="off" />
    </label>
    <label class="field">
      <span>赛事</span>
      <select id="eventId"><option value="0">全部赛事</option></select>
    </label>
    <label class="field">
      <span>性别</span>
      <select id="gender">
        <option value="">全部</option>
        <option value="Men's">Men's</option>
        <option value="Women's">Women's</option>
      </select>
    </label>
    <label class="field">
      <span>腰带</span>
      <select id="belt">
        <option value="">全部</option>
        <option>White</option>
        <option>Blue</option>
        <option>Purple</option>
        <option>Brown</option>
        <option>Black</option>
      </select>
    </label>
    <label class="field">
      <span>赛制</span>
      <select id="style">
        <option value="">全部</option>
        <option value="GI">GI</option>
        <option value="NO-GI">NO-GI</option>
      </select>
    </label>
    <label class="check">
      <input id="hideBye" type="checkbox" checked />
      <span>隐藏 BYE</span>
    </label>
    <div class="view-toggle" role="group" aria-label="视图">
      <button type="button" id="viewMatches" class="active">对阵</button>
      <button type="button" id="viewPlacements">名次</button>
      <button type="button" id="viewAthletes">选手</button>
    </div>
  </section>

  <p id="loadError" class="error" hidden></p>
  <p id="emptyState" class="empty" hidden>无匹配结果</p>
  <p id="athleteSearchHint" class="empty" hidden>请输入至少 2 个字符搜索选手</p>

  <section id="athletePanel" hidden>
    <div id="athleteIdentities" class="athlete-identities"></div>
    <div class="athlete-actions">
      <button type="button" id="athleteLoadProfile" disabled>查看档案</button>
    </div>
    <p id="athleteTruncated" class="athlete-truncated" hidden>数据已截断，仅显示部分记录</p>
    <div id="athleteSummary" class="athlete-summary" hidden></div>
    <div id="athleteTimelineWrap" hidden>
      <h2 class="section-title">时间线</h2>
      <div class="table-wrap">
        <table class="data">
          <thead id="athleteTimelineHead"></thead>
          <tbody id="athleteTimelineBody"></tbody>
        </table>
      </div>
    </div>
    <div id="athleteEncountersWrap" hidden>
      <h2 class="section-title">对阵明细</h2>
      <div class="table-wrap">
        <table class="data">
          <thead id="athleteEncountersHead"></thead>
          <tbody id="athleteEncountersBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <div id="resultTableWrap" class="table-wrap">
    <table class="data">
      <thead id="resultHead"></thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

  <nav class="pager" id="pager" aria-label="分页" hidden>
    <label class="field pager-size">
      <span>每页</span>
      <select id="pageSize">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </label>
    <p id="pageInfo" class="page-info" aria-live="polite"></p>
    <div class="pager-btns">
      <button type="button" id="pageFirst">首页</button>
      <button type="button" id="pagePrev">上一页</button>
      <div id="pageNums" class="page-nums" role="group" aria-label="页码"></div>
      <button type="button" id="pageNext">下一页</button>
      <button type="button" id="pageLast">末尾</button>
    </div>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
